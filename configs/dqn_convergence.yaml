protocol:
  name: dqn_convergence_training
  version: 1.0.0
  pilot_episodes: 100
  minimum_training_episodes: 300
  maximum_training_episodes: 1000
  city_master_seed: 20260922
  agent_seed: 20260922
  fixed_city_across_training: true
temporal:
  decision_interval_hours: 0.25
  decision_interval_semantics: fleet_round
  prediction_horizon_hours: 24.0
fill_dynamics:
  distribution: uniform
  minimum_rate_percent_per_hour: 0.0
  maximum_rate_percent_per_hour: 1.25
  seed_namespace: dqn-primary-fill-rates
telemetry:
  verified_fraction: 1.0
  inject_fdi_during_training: false
hazard:
  generation_mode: deterministic_representative
  predicted_combustion_risk_count: 1
  emergency_fire_count: 0
  excess_moisture_count: 0
  selection_seed: 20260922
  predicted_combustion_normalized_severity: 0.6666666666666666
environment:
  num_bins: 1000
  num_trucks: 10
  truck_capacity_tonnes: 10.0
  fuel_efficiency_km_per_litre: 2.5
  near_full_threshold_percent: 90.0
  sla_limit_hours: 6.0
  max_steps: 1000
dqn:
  hidden_layers:
  - 256
  - 128
  - 64
  gamma: 0.95
  replay_capacity: 100000
  batch_size: 64
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_episodes: 300
  optimizer: adam
  learning_rate: 0.001
  replay_warmup_transitions: 1000
  target_update_steps: 250
  loss_function: smooth_l1
  replay_state_storage_dtype: float16
convergence:
  enabled: true
  minimum_episodes: 300
  maximum_episodes: 1000
  window_size: 50
  patience_windows: 3
  reward_absolute_slope_threshold: 0.1
  loss_absolute_slope_threshold: 0.001
  greedy_evaluation_interval_episodes: 50
  greedy_relative_change_threshold: 0.01
  require_natural_termination: true
outputs:
  episode_metrics_csv: results/raw/dqn_convergence_training_episodes.csv
  greedy_evaluations_csv: results/raw/dqn_convergence_greedy_evaluations.csv
  convergence_checks_csv: results/processed/dqn_convergence_checks.csv
  model_checkpoint: results/models/dqn_convergence_final.pt
  checkpoint_directory: results/models/dqn_convergence_checkpoints
  protocol_snapshot: results/processed/dqn_convergence_protocol_snapshot.yaml
validation:
  run_during_primary_training: false
  independent_training_replicates: 10
  independent_evaluation_runs: 100
  greedy_evaluation_epsilon: 0.0
  temporal_sensitivity:
    decision_interval_hours:
    - 0.25
    - 0.5
    - 1.0
    prediction_horizon_hours:
    - 12.0
    - 24.0
    - 48.0
  fill_rate_sensitivity:
    maximum_rate_percent_per_hour:
    - 0.625
    - 1.25
    - 2.5

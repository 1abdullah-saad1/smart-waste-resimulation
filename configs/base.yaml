experiment:
  name: smart_waste_resimulation
  version: "0.1.0"

random:
  master_seed: 20260922


# ============================================================
# CITY MODEL
# ============================================================

city:
  area_km2: 50.0
  shape: square

  num_bins: 1000

  distance_model:
    metric: euclidean

  # Reconstruction assumption:
  # The manuscript specifies a 50 km² area but does not define
  # the exact city geometry or depot location.
  depot:
    location: center


# ============================================================
# BIN MODEL
# ============================================================

bins:
  initial_fill:
    distribution: uniform
    minimum_percent: 0.0
    maximum_percent: 100.0

  # HDR manuscript threshold.
  service_threshold_percent: 80.0

  overflow_threshold_percent: 100.0


# ============================================================
# WASTE / DEMAND MODEL
# ============================================================

waste:
  # Reconstruction assumption.
  bin_volume_m3: 1.1

  density:
    # Reconstruction assumption.
    nominal_kg_per_m3: 229.088

  sensitivity_density_kg_per_m3:
    - 136.364
    - 229.088
    - 318.182

  demand_model:
    type: proportional_to_fill


# ============================================================
# FLEET
# ============================================================

fleet:
  # Manuscript values.
  num_trucks: 10
  truck_capacity_tonnes: 10.0
  fuel_efficiency_km_per_litre: 2.5


# ============================================================
# ROUTING BASELINES
# ============================================================

routing:

  # ----------------------------------------------------------
  # Traditional Static Routing
  # ----------------------------------------------------------

  tsr:
    # Reconstruction assumption:
    # The manuscript states that TSR visits every assigned bin
    # but does not specify the exact assignment mechanism.
    assignment: angular_sectors

    route_order: nearest_neighbor

    visit_all_bins: true

    capacity_policy: return_to_depot_and_resume


  # ----------------------------------------------------------
  # Heuristic Dynamic Routing
  # ----------------------------------------------------------

  hdr:
    # Primary reproduction:
    # The manuscript describes HDR as a greedy nearest-neighbor
    # policy serving bins reporting >= 80% fill.
    primary_policy: global_greedy_nearest_neighbor

    service_threshold_percent: 80.0

    # Supplementary sensitivity analysis.
    sensitivity:
      - sector_nearest_neighbor


# ============================================================
# FALSE DATA INJECTION
# ============================================================

attack:

  # Manuscript attack severities.
  fdi_rates:
    - 0.00
    - 0.10
    - 0.15
    - 0.20
    - 0.30

  fdi:
    forged_fill_percent: 100.0

    node_selection: uniform_without_replacement

    # --------------------------------------------------------
    # Primary manuscript threat model
    # --------------------------------------------------------

    primary_threat:
      # Must match the AttackType literal used by the code.
      type: external_unauthenticated

      # Primary reproduction treats each attack-rate scenario
      # as independently seeded.
      selection_mode: independent_by_rate


    # --------------------------------------------------------
    # Supplementary security-boundary experiment
    # --------------------------------------------------------

    boundary_case:
      # Must match the AttackType literal used by the code.
      type: authenticated_compromise

      # Supplementary experiment only.
      selection_mode: paired_nested


  # ----------------------------------------------------------
  # Original five-day FDI experiment
  # ----------------------------------------------------------

  five_day_test:
    days: 5
    injected_alerts_per_day: 10
    total_injected_alerts: 50

    attack_type: external_unauthenticated

    forged_fill_percent: 100.0


# ============================================================
# EVALUATION
# ============================================================

evaluation:
  # Manuscript routing / attack evaluation.
  episodes_per_scenario: 100

  confidence_level: 0.95

  # Used in the supplementary FDI robustness experiments.
  attack_replicates: 100

  # Primary reproduction:
  # attack severities are independently seeded.
  primary_attack_selection_mode: independent_by_rate

  # Supplementary experiment only:
  # 10% subset 15% subset 20% subset 30% within a replicate.
  paired_attack_severities: true

  supplementary_attack_selection_mode: paired_nested


# ============================================================
# REINFORCEMENT LEARNING
# ============================================================

rl:

  # ----------------------------------------------------------
  # STATE
  #
  # s_t = (L_t, F_t, H_t, T_t)
  # ----------------------------------------------------------

  state:
    active_truck_location: true
    verified_fill_level: true
    hazard_severity: true
    elapsed_full_bin_time: true


  # ----------------------------------------------------------
  # CANDIDATE SELECTION
  # ----------------------------------------------------------

  candidates:
    # Manuscript proactive-routing threshold.
    near_full_threshold_percent: 90.0

    # Representative manuscript scenario:
    # 75-80% bins may be added when predicted to overflow.
    predictive_fill_min_percent: 75.0
    predictive_fill_max_percent: 80.0

    exclude_unverified_events: true

    # Critical hazards override ordinary routing candidates.
    critical_hazard_override: true


  # ----------------------------------------------------------
  # DYNAMIC FILL / TEMPORAL MODEL
  # ----------------------------------------------------------

  dynamics:
    # These are intentionally not assigned arbitrary values yet.
    # The manuscript does not specify the exact routing decision
    # interval or prediction horizon.

    decision_interval_hours: null
    prediction_horizon_hours: null

    # Fill-rate bounds will be explicitly selected and documented
    # before the full DQN experiment.
    minimum_fill_rate_percent_per_hour: null
    maximum_fill_rate_percent_per_hour: null


  # ----------------------------------------------------------
  # REWARD
  #
  # R_t = wc*C_t - wd*D_t - wh*H_t - ws*S_t
  # ----------------------------------------------------------

  reward:
    # Manuscript values.
    collection_weight: 1.0
    distance_weight: 0.5
    hazard_delay_weight: 5.0
    sla_violation_weight: 3.0


  # ----------------------------------------------------------
  # DQN
  # ----------------------------------------------------------

  dqn:
    # Manuscript architecture.
    hidden_layers:
      - 256
      - 128
      - 64

    activation: relu
    output_activation: linear

    # Manuscript values.
    discount_factor: 0.95

    replay_buffer_size: 100000
    batch_size: 64

    epsilon_start: 1.0
    epsilon_end: 0.01

    # The manuscript says epsilon decays linearly over the
    # training episodes. The experiment uses 100 episodes.
    epsilon_decay_episodes: 100

    optimizer: adam

    episodes: 100

    # --------------------------------------------------------
    # Reconstruction / implementation assumptions
    # --------------------------------------------------------

    # The learning-rate value is missing from the manuscript.
    learning_rate: 0.001

    # The following implementation details were not specified
    # in the manuscript and must therefore be reported explicitly
    # in the revised methodology.
    replay_warmup_transitions: 1000
    target_update_steps: 250

    loss_function: smooth_l1

    # Storage optimization only.
    # Neural-network calculations remain float32.
    replay_state_storage_dtype: float16


  # ----------------------------------------------------------
  # SLA
  # ----------------------------------------------------------

  sla:
    # Manuscript rule.
    full_bin_threshold_percent: 100.0

    # Violation occurs when the bin remains full for > 6 h.
    violation_after_hours: 6.0

    # The manuscript references SLA_HAZARD_LIMIT but does not
    # report its numerical value. Do not invent one.
    hazard_violation_after_hours: null

    # Governance-layer rule from the manuscript.
    challenge_window_hours: 48.0


# ============================================================
# MULTI-HAZARD MODEL
# ============================================================

hazard:

  # Explicit manuscript emergency-fire threshold.
  emergency_fire_threshold_c: 70.0

  # ----------------------------------------------------------
  # Numerical encoding for DQN state H_t
  # ----------------------------------------------------------
  #
  # Reconstruction convention:
  # the manuscript specifies hazard priority but does not define
  # a numerical DQN encoding.
  severity_encoding:
    none: 0.0
    excess_moisture: 1.0
    predicted_combustion_risk: 2.0
    emergency_fire: 3.0

  # Exact hazard-generation probabilities/frequencies are not
  # specified in the manuscript. They will be defined later as
  # explicit experimental reconstruction/sensitivity parameters.
  generation:
    emergency_fire_probability: null
    predicted_combustion_risk_probability: null
    excess_moisture_probability: null
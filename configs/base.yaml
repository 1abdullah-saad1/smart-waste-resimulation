experiment:
  name: smart_waste_resimulation
  version: "0.1.0"

random:
  master_seed: 20260922

city:
  area_km2: 50.0
  shape: square
  num_bins: 1000
  distance_model:
    metric: euclidean
  # Resimulation assumption:
  # the manuscript specifies 50 km² but not the geometry.
  depot:
    location: center

bins:
  initial_fill:
    distribution: uniform
    minimum_percent: 0.0
    maximum_percent: 100.0

  service_threshold_percent: 80.0
  overflow_threshold_percent: 100.0

waste:
  bin_volume_m3: 1.1

  density:
    nominal_kg_per_m3: 229.088

  sensitivity_density_kg_per_m3:
    - 136.364
    - 229.088
    - 318.182

  demand_model:
    type: proportional_to_fill

fleet:
  num_trucks: 10
  truck_capacity_tonnes: 10.0
  fuel_efficiency_km_per_litre: 2.5

routing:
  tsr:
    assignment: angular_sectors
    route_order: nearest_neighbor
    visit_all_bins: true
    capacity_policy: return_to_depot_and_resume

  hdr:
    primary_policy: sector_nearest_neighbor
    service_threshold_percent: 80.0

    sensitivity:
      - global_greedy_nearest_neighbor

attack:
  fdi_rates:
    - 0.00
    - 0.10
    - 0.15
    - 0.20
    - 0.30

  fdi:
    forged_fill_percent: 100.0
    node_selection: uniform_without_replacement

    primary_threat:
      type: external_unauthenticated_forgery

    boundary_case:
      type: authenticated_compromised_node

evaluation:
  episodes_per_scenario: 100
  attack_replicates: 100
  confidence_level: 0.95
  paired_attack_severities: true

rl:
  state:
    active_truck_location: true
    verified_fill_level: true
    hazard_severity: true
    elapsed_full_bin_time: true

  candidates:
    near_full_threshold_percent: 90.0
    predictive_fill_min_percent: 75.0
    predictive_fill_max_percent: 80.0
    exclude_unverified_events: true
    critical_hazard_override: true

  reward:
    collection_weight: 1.0
    distance_weight: 0.5
    hazard_delay_weight: 5.0
    sla_violation_weight: 3.0

  dqn:
    hidden_layers:
      - 256
      - 128
      - 64

    activation: relu
    output_activation: linear

    discount_factor: 0.95
    replay_buffer_size: 100000
    batch_size: 64

    epsilon_start: 1.0
    epsilon_end: 0.01

    optimizer: adam

    episodes: 100

    # Reconstruction assumption.
    # The manuscript value is missing.
    learning_rate: 0.001

    sla:
      full_bin_threshold_percent: 100.0
      violation_after_hours: 6.0

      # The manuscript references SLA_HAZARD_LIMIT but does not
      # report its numerical value.
      hazard_violation_after_hours: null

      # Governance-layer rule from the manuscript.
      challenge_window_hours: 48.0

hazard:
  emergency_fire_threshold_c: 70.0

  # Reconstruction encoding for DQN state H_t.
  # The manuscript defines hazard priority but does not
  # define a numerical severity scale.
  severity_encoding:
    none: 0.0
    excess_moisture: 1.0
    predicted_combustion_risk: 2.0
    emergency_fire: 3.0